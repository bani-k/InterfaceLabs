<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/x-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet" />
<title>Color Palette Select - Interface Labs</title>

<link href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@200..700&display=swap" rel="stylesheet"/>

<style>
body, html {
  margin: 0;
  padding: 0;
  height: 100%;
  background-image: url(background3.png);
  background-size: cover;
  background-attachment: fixed;
  font-family: "Stack Sans Headline", sans-serif;
}

/* NAVBAR */
.navbar {
  position: sticky;
  top: 0;
  display: flex;
  justify-content: space-evenly;
  align-items: center;
  background-color: #121212;
  min-height: 60px;
  z-index: 999;
}

.navlinks {
  color: white;
  text-decoration: none;
  font-size: 20px;
  transition: 0.2s;
}

.navlinks:hover {
        font-size: larger;
        transform: scale(1.3);
        background: linear-gradient(135deg, #ccefff, #00bfa5);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 0 5px rgba(163, 232, 253, 0.6),
          0 0 8px rgba(72, 180, 207, 0.6);
      }
      

.user-chip {
  display: flex; align-items: center; gap: 8px;
  background: #1e1e1e; border: 1px solid #2a2a2a;
  border-radius: 20px; padding: 5px 12px;
  color: #ccc; font-size: 13px; cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  text-decoration: none;
}
.user-chip:hover { border-color: #00bfa5; background: #252525; }
.user-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: linear-gradient(135deg, #00bfa5, #00796b);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px; font-weight: 700;
}

.logo {
  height: 80px;
}

/* TOP TAG BAR */
#tagBar {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  padding: 20px;
}

.tag-btn {
  padding: 8px 14px;
  border-radius: 8px;
  border: none;
  background: linear-gradient(135deg, #3e4142, #00bfa5);
  color: white;
  cursor: pointer;
  transition: 0.2s;
}

.tag-btn:hover {
  transform: scale(1.05);
}

/* GRID */
#paletteContainer {
  max-width: 1100px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  padding: 20px;
}

/* CARD */
.palette-card {
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  border-radius: 14px;
  padding: 10px;
  height: 120px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

/* COLORS */
.colors {
  display: flex;
  height: 60px;
  border-radius: 8px;
  overflow: hidden;
}

.color-block {
  flex: 1;
}

/* LIKE BUTTON */
.like-btn {
  font-size: 12px;
  padding: 5px;
  border: none;
  background: #e4dfdf2b;
  color: rgb(36, 32, 32);
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<nav class="navbar">
  <a href="Fin.html"><img src="interfacelabslogo.png" class="logo"></a>
  <a href="create.html" class="navlinks">Create Element</a>
  <a href="#" class="navlinks">Color Palette</a>
  <a href="typo.html" class="navlinks">Font evaluate</a>
  <a href="dragdrop.html" class="navlinks">Drag & Drop</a>
  <div id="nav-user-chip"></div>
<script>
  const name = localStorage.getItem("name") || "";
  const initials = name.split(" ").map(w => w[0]).slice(0,2).join("").toUpperCase();
  if (name) {
    document.getElementById("nav-user-chip").innerHTML =
      `<a href="profile.html" class="user-chip">
         <div class="user-avatar">${initials}</div>
         <span>${name}</span>
       </a>`;
  }
</script>
</nav>

<!-- TAG FILTER BAR -->
<div id="tagBar"></div>

<!-- PALETTES -->
<div id="paletteContainer"></div>

<script>
  let mode = "all"; // "all" | "tag" | "top"
  let allPalettes = [];
  let currentTag = "";
  async function init() {
  const res = await fetch("http://localhost:5000/palettes");
  allPalettes = await res.json();

  renderTags(allPalettes);   // always from full list
  renderPalettes(allPalettes);
}

function loadPalettes(tag = "") {
  currentTag = tag;

  if (!tag) {
    mode = "all";
    renderPalettes(allPalettes);
    return;
  }

  mode = "tag";
  const filtered = allPalettes.filter(p => p.tags.includes(tag));
  renderPalettes(filtered);
}

async function loadTop() {
  mode = "top";

  const res = await fetch("http://localhost:5000/top-palettes");
  const data = await res.json();

  renderPalettes(data);
}

function renderTags(palettes) {
  const tagBar = document.getElementById("tagBar");

  const allTags = new Set();
  palettes.forEach(p => p.tags.forEach(t => allTags.add(t)));

  tagBar.innerHTML = `
    <button class="tag-btn" onclick="loadPalettes()">All</button>
    ${[...allTags].map(tag =>
      `<button class="tag-btn" onclick="loadPalettes('${tag}')">${tag}</button>`
    ).join("")}
    <button class="tag-btn" onclick="loadTop()">MOST LIKED</button>
  `;
}

function renderPalettes(palettes) {
  const container = document.getElementById("paletteContainer");
  container.innerHTML = "";

  palettes.forEach(p => {
    const div = document.createElement("div");
    div.className = "palette-card";

    div.innerHTML = `
      <div class="colors">
        ${p.colors.map(c => `<div class="color-block" style="background:${c}"></div>`).join("")}
      </div>
      <button class="like-btn" onclick="like('${p._id}')">❤️ ${p.likes}</button>
    `;

    container.appendChild(div);
  });
}
async function like(id) {
  await fetch("http://localhost:5000/like/" + id, {
    method: "POST"
  });

  const palette = allPalettes.find(p => p._id === id);
  if (palette) palette.likes++;

  if (mode === "top") {
    loadTop();
  } else {
    loadPalettes(currentTag);
  }
}

init();
</script>

</body>
</html>
